%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/light/rohm,rpr0400.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ROHM RPR-0400 ambient light and proximity sensor

maintainers:
  - Custom Firmware <gabin278@gmail.com>

description:
  RPR-0400 is an I2C ambient light and proximity sensor. The ambient
  light block has two photodiode channels, one sensitive to visible and
  infrared light and one to infrared only. An interrupt output can
  signal proximity and ambient light threshold events.

properties:
  compatible:
    const: rohm,rpr0400

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  vdd-supply: true

required:
  - compatible
  - reg
  - vdd-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        light-sensor@39 {
            compatible = "rohm,rpr0400";
            reg = <0x39>;
            interrupt-parent = <&gpio>;
            interrupts = <2 IRQ_TYPE_LEVEL_LOW>;
            vdd-supply = <&vdd>;
        };
    };
...
